<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hermagotchi</title>
<style>
  html, body, #root { margin:0; height:100%; background:#0b0d16; color:#e6ebff; }
  body { overflow:hidden; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "@hermes/plugin-sdk": "data:text/javascript,export const SandboxedFrame=null;export default{};"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
function readToken() {
  try { return window.parent && window.parent.__HERMES_SESSION_TOKEN__; } catch (_e) { return null; }
}
async function waitToken(ms = 8000) {
  const start = Date.now();
  while (Date.now() - start < ms) {
    const t = readToken();
    if (t) return t;
    await new Promise((r) => setTimeout(r, 50));
  }
  return readToken();
}
const token = await waitToken();
const rawFetch = window.fetch.bind(window);
window.fetch = function hermesAuthedFetch(input, init) {
  const opts = Object.assign({}, init || {});
  const headers = new Headers(opts.headers || {});
  const t = readToken() || token;
  if (t) headers.set("X-Hermes-Session-Token", t);
  opts.headers = headers;
  if (!opts.credentials) opts.credentials = "same-origin";
  return rawFetch(input, opts);
};

const [{ createElement }, { createRoot }, paneMod] = await Promise.all([
  import("react"),
  import("react-dom/client"),
  import("./hermagotchi-pane.mjs"),
]);

paneMod.injectStyles();
const params = new URLSearchParams(location.search);
const tab = params.get("tab") || "habitat";
const contribution = paneMod.createPaneContribution();
const element = contribution.render({ initialTab: tab, live: true, chatEnabled: true });
createRoot(document.getElementById("root")).render(element);
</script>
</body>
</html>
